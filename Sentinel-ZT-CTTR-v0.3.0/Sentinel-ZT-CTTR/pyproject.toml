[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-zt-cttr"
version = "0.3.0"
description = "Evidence-driven incident triage and bounded zero-trust response"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sentinel-ZT-CTTR contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
sentinel-zt-cttr = "sentinel_zt.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel_zt*"]

[tool.setuptools.package-data]
sentinel_zt = ["data/*.json"]
